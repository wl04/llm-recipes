# SVG captures contain clipped terminal text.
[files]
extend-exclude = ["assets/tui/*.svg"]

# The baseline runner uses the first eight hex digits of a UUID as the run ID.
[type.baseline-results]
extend-glob = ["results.json"]
extend-ignore-re = ['"id"\s*:\s*"[0-9a-f]{8}"']

# Payload tokens, not prose: an arbitrary fixture event body, and a truncated identifier copied
# verbatim from the engine log line the parser tests feed as input.
[default.extend-words]
Hel = "Hel"
availabl = "availabl"
