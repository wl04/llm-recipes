[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.14"

dependencies = ["PyYAML==6.0.3", "textual==8.2.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# The families beyond the defaults each keep one written convention checkable:
# PT states pytest style, BLE001 requires a reason for a blind except, ARG002 and PLW2901
# keep signatures and loop variables meaningful, PLW1510 requires an explicit `check=` for
# subprocess.run, ERA001 rejects commented-out code, and ANN401 asks every `Any` to state
# the JSON or request boundary it belongs to.
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "PT",
    "BLE001",
    "ARG002",
    "RET",
    "C4",
    "PIE",
    "SIM",
    "ERA001",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY002",
    "PLW1510",
    "PLW2901",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Real engine log lines are kept verbatim as test fixtures.
"tests/test_baseline_engine_log.py" = ["E501"]
"tests/test_baseline_session_cli.py" = ["E501"]
# Container build scripts import and validate after runtime lock checks by design.
"runtimes/*/container/*.py" = ["E402", "I001"]
# Recorded JSON documents and request builders stay loosely shaped; code reads them through
# the schema module instead.
"tests/*.py" = ["ANN401"]
# Test doubles keep the parameter names of the interfaces they satisfy.
"tests/fake_server.py" = ["ARG002"]
"tests/test_baseline_guided.py" = ["ARG002"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/scripts"
files = [
    "scripts",
    "runtimes/exllamav3-tabbyapi/container",
    "runtimes/exllamav3-tabbyapi/scripts",
    "tests",
]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "ruamel.*",
    "huggingface_hub",
    "exllamav3",
    "exllamav3.*",
    "exllamav3_ext",
    "common",
    "common.*",
    "serve",
    "serve.*",
]
ignore_missing_imports = true
