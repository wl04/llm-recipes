[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.12"

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Real engine log lines are kept verbatim as test fixtures.
"tests/test_baseline_engine_log.py" = ["E501"]
"tests/test_baseline_session_cli.py" = ["E501"]
# Container build scripts import and validate after runtime lock checks by design.
"runtimes/*/container/*.py" = ["E402", "I001"]
# The app is imported after the Textual availability skip; conftest puts scripts/ on the path.
"tests/test_tui.py" = ["E402"]

[tool.mypy]
files = [
    "scripts/generate_configurations.py",
    "scripts/launch.py",
    "scripts/launcher.py",
    "scripts/tui.py",
    "scripts/doctor.py",
    "scripts/paths.py",
    "scripts/install.py",
    "scripts/baseline",
    "scripts/run_baseline.py",
    "runtimes/exllamav3-tabbyapi/container",
    "runtimes/exllamav3-tabbyapi/scripts",
    "tests",
]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "ruamel.*",
    "huggingface_hub",
    "exllamav3",
    "exllamav3.*",
    "exllamav3_ext",
    "common",
    "common.*",
    "serve",
    "serve.*",
]
ignore_missing_imports = true