[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Container build scripts import and validate after runtime lock checks by design.
"recipes/*/container/*.py" = ["E402", "I001"]

[tool.mypy]
files = ["scripts/generate_configurations.py", "tests"]
strict = true
warn_unused_ignores = true