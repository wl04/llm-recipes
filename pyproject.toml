[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
files = ["scripts/generate_configurations.py"]
strict = true
warn_unused_ignores = true