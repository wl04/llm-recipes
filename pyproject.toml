[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Container build scripts import and validate after runtime lock checks by design.
"recipes/*/container/*.py" = ["E402", "I001"]

[tool.mypy]
files = [
    "scripts/generate_configurations.py",
    "scripts/launch.py",
    "recipes/qwen3.8-27b-exl3-rx-9070-xt-16-gb-vram/scripts/gpu.py",
    "recipes/qwen3.8-27b-exl3-rx-9070-xt-16-gb-vram/scripts/serve.py",
    "recipes/qwen3.8-27b-exl3-rx-9070-xt-16-gb-vram/scripts/prepare_models.py",
    "tests",
]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "ruamel.*",
    "huggingface_hub",
    "exllamav3",
    "exllamav3.*",
    "exllamav3_ext",
    "common",
    "common.*",
]
ignore_missing_imports = true