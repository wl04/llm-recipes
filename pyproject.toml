[project]
name = "llm-recipes"
version = "0.1.0"
description = "Language model configurations, results, and serving recipes"
requires-python = ">=3.12"

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The families beyond the defaults each keep one written convention checkable:
# PT states pytest style, BLE001 requires a reason for a blind except, ARG002 and PLW2901
# keep signatures and loop variables meaningful, PLW1510 requires an explicit `check=` for
# subprocess.run, and ERA001 rejects commented-out code.
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "PT",
    "BLE001",
    "ARG002",
    "RET",
    "C4",
    "PIE",
    "SIM",
    "ERA001",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY002",
    "PLW1510",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# Real engine log lines are kept verbatim as test fixtures.
"tests/test_baseline_engine_log.py" = ["E501"]
"tests/test_baseline_session_cli.py" = ["E501"]
# Container build scripts import and validate after runtime lock checks by design.
"runtimes/*/container/*.py" = ["E402", "I001"]
# The app is imported after the Textual availability skip; conftest puts scripts/ on the path.
"tests/test_tui.py" = ["E402"]
# Test doubles keep the parameter names of the interfaces they satisfy.
"tests/fake_server.py" = ["ARG002"]
"tests/test_baseline_guided.py" = ["ARG002"]

[tool.mypy]
files = [
    "scripts/generate_configurations.py",
    "scripts/launch.py",
    "scripts/launcher.py",
    "scripts/tui.py",
    "scripts/doctor.py",
    "scripts/paths.py",
    "scripts/install.py",
    "scripts/baseline",
    "scripts/run_baseline.py",
    "runtimes/exllamav3-tabbyapi/container",
    "runtimes/exllamav3-tabbyapi/scripts",
    "tests",
]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "ruamel.*",
    "huggingface_hub",
    "exllamav3",
    "exllamav3.*",
    "exllamav3_ext",
    "common",
    "common.*",
    "serve",
    "serve.*",
]
ignore_missing_imports = true