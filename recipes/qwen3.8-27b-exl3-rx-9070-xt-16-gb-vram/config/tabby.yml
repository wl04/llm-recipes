network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true
  allowed_origins: []
  disable_fetch_requests: true
model:
  model_dir: /models
  model_name: qwen3.8-27b-exl3-3bpw
  backend: exllamav3
  max_seq_len: 4096
  cache_size: 4096
  cache_mode: Q4
  chunk_size: 1024
  max_batch_size: 1
  tensor_parallel: false
  vision: false
  inline_model_loading: false
  template_vars_default:
    enable_thinking: true
draft_model:
  draft_mode: model
  draft_model_dir: /models
  draft_model_name: qwen3.8-27b-dflash2-exl3-3bpw
  draft_cache_mode: Q4
memory:
  sysmem_recurrent_cache: 4096
sampling:
  temperature:
    override: 1.0
    force: false
  top_k:
    override: 20
    force: false
  top_p:
    override: 0.95
    force: false
  min_p:
    override: 0
    force: false
  repetition_penalty:
    override: 1
    force: false
  presence_penalty:
    override: 0
    force: false
