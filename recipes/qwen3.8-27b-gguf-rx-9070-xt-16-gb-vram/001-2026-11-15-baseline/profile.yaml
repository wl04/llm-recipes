id: Qwen3.8-27B / GGUF / RX 9070 XT / 16 GB VRAM
hardware:
  gpu: AMD Radeon RX 9070 XT
  cpu: AMD Ryzen 7 9800X3D
  memory:
    architecture: discrete
    dedicated_vram_gib: 16
    system_ram_gib: 64
    unified_memory_gib: null
os:
  name: Ubuntu
  version: '26.10'
  kernel: 7.3.0-10-generic
  kernel_driver: amdgpu
software:
  harness: LM Studio Bionic
  harness_version: 1.2.0 (build 2)
  engine: llama.cpp
  engine_version: 2.73.0
  engine_version_note: LM Studio-specific version; upstream llama.cpp version unknown
  backend: Vulkan
  backend_api_version: 1.4.354
  gpu_driver: Mesa RADV
  gpu_driver_version: 26.2.4-1ubuntu1
model:
  name: Qwen3.8-27B
  format: GGUF
  quantization: IQ3_XXS
  repository: https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
  artifacts:
  - Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
  - mmproj-Qwen3.8-27B-BF16.gguf
settings:
  serving:
    served_model_id: qwen3.8-27b-gsq-rco
    auto_hardware_optimization: false
    context_length_tokens: 131072
    gpu_offload: 65 (maximum in the UI)
    cpu_thread_pool: 6
    eval_batch_size: 2048
    physical_batch_size: 512
    parallel_predictions: 1
    flash_attention: true
    kv_cache_quantization: Q8_0 / Q8_0
    kv_gpu_offload_unified: Both on
    ctx_checkpoints: 32
    memory_map: Both on
    speculative_decoding: MTP
    draft_token_limits: 3 / 0 / 0
    vision: true — vision adapter mmproj-Qwen3.8-27B-BF16.gguf loaded
  thinking:
    control: 'Per request: reasoning_effort none for performance and functional requests,
      reasoning_effort high for the reasoning case'
    enabled: false
  requests:
    forced_tool_call: tool_choice required (string form)
    endpoint: /v1/chat/completions
    token_counting: Unavailable — LM Studio exposes no usable tokenize route
    streaming: Performance requests streamed
    concurrency: 1
  notes: 'Request policy: functional checks run at temperature 0. Output caps: 1,024 for context
    cases, 2,048 for sustained generation, 1,536 for reasoning, 512 for vision, 256 for text
    and conversation. Software configuration basis: model, context length, request policy,
    corpus hash, and runner commit f78d3db were recorded by the baseline run.'
