id: Model / Format / Hardware / Memory
hardware:
  cpu: CPU model
  platform: Platform name
  kernel: Kernel version
  ram_gb: 32
  motherboard: Motherboard name
  bios: BIOS version and mode
  gpu: GPU model
  vram_gb: 12
  driver_stack: Driver stack
  driver_version: Driver version
os:
  distribution: Distro
  version: Version
  container_engine: Podman
  container_engine_version: "12.0.0"
  filesystem: ext4
model:
  path: model-path
  format: Format name
  quantization: Quantization name
  context_length: 8192
  size_gib: 8.0
  preparation: Preparation summary
# Engine settings in five canonical groups. Keys are snake_case; the generator
# validates sampling/thinking/requests against a whitelist and drops sections
# that are absent or empty.
settings:
  serving:
    speculative_decoding: null
  sampling:
    # Only these keys are allowed. A named preset (e.g. conservative) can
    # stand alone; explicit parameters may be listed instead or alongside.
    mode: null
    temperature: null
    top_k: null
    top_p: null
    min_p: null
    repetition_penalty: null
    presence_penalty: null
    seed: null
  thinking:
    # Only these keys are allowed; enabled takes true/false.
    enabled: null
    control: null
    budget: null
  requests:
    endpoint: /v1/chat/completions
    streaming: true
    concurrency: null
    token_counting: null
    forced_tool_call: null
    max_output_tokens: null
  # The only free-text field; rendered last as "Experiment notes".
  notes: null
# Optional display-label overrides for the built-in label registry:
# labels:
#   requests.max_output_tokens: Response length limit
