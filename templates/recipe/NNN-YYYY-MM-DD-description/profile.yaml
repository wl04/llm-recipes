id: Model / Format / Hardware / Memory
hardware:
  cpu: CPU model
  gpu: GPU model
  memory:
    system_ram_gib: null
    dedicated_vram_gib: null
    unified_memory_gib: null
os:
  name: OS name
  version: null
  kernel: null
  kernel_driver: null
software:
  harness: null
  harness_version: null
  engine: null
  engine_version: null # Quote a release number such as "0.1.62".
  revision: null # Engine source commit URL.
  backend: null
  rocm_version: null # Quote the container's ROCm version when applicable.
  server: null
  server_version: null
  base_image_tag: null # Exact tag or Docker Hub tag link.
  base_image: null # Image reference with digest.
  running_image_id: null
model:
  name: Model name
  format: Format name
  quantization: null
  repository: null
  revision: null
  draft_repository: null
  draft_revision: null
  draft_quantization: null
# Engine settings in five canonical groups. Keys are snake_case; the generator
# validates sampling/thinking/requests against a whitelist and drops sections
# that are absent or empty.
settings:
  serving:
    speculative_decoding: null
    draft_method: null
    max_draft_tokens: null
    context_length_tokens: null
    kv_cache: null
    gpu_resident_kv_cells: null
    vision: null
    vision_max_image_tokens: null
  sampling:
    # Only these keys are allowed. A named preset (e.g. conservative) can
    # stand alone; explicit parameters may be listed instead or alongside.
    mode: null
    temperature: null
    top_k: null
    top_p: null
    min_p: null
    repetition_penalty: null
    presence_penalty: null
    seed: null
  thinking:
    # Only these keys are allowed; enabled takes true/false.
    enabled: null
    control: null
    budget: null
  requests:
    endpoint: /v1/chat/completions
    streaming: true
    concurrency: null
    token_counting: null
    forced_tool_call: null
    max_output_tokens: null
  # The only free-text field; rendered last as "Experiment notes".
  notes: null
# Optional display-label overrides for the built-in label registry:
# labels:
#   requests.max_output_tokens: Response length limit
